# Build the retroXR flycast core for Windows, Android, Linux and macOS and
# publish it as a release, so retroXR's CoreDownloadManager can fetch it.
#
# This fork hands each VMU's LCD and beep to a frontend that answers two private
# environment calls, the controller display and controller audio interfaces,
# instead of drawing the screen over the game and mixing the beep into it. It
# also feeds the Dreamcast microphone (HKT-7200) from the libretro microphone
# interface, where the stock core's recording calls were empty stubs.
#
#   Windows  flycast_libretro.dll.zip          containing flycast_libretro.dll
#   Android  flycast_libretro_android.so.zip   containing flycast_libretro_android.so
#   Linux    flycast_libretro.so.zip           containing flycast_libretro.so
#   macOS    flycast_libretro_arm64.dylib.zip
#            flycast_libretro_x86_64.dylib.zip
#                                              each containing flycast_libretro.dylib
#
# flycast is CMake-only -- there is no libretro/Makefile as in snes9x or mGBA --
# so every job configures and builds rather than calling make with a platform. The
# Windows recipe is lifted from this repo's own c-cpp.yml, which builds
# libretro-x86_64-w64-mingw32 under msys2 rather than with MSVC.
#
# The release must NOT be a prerelease: the download URL is the /releases/latest/
# form so shipping a build needs no app update, and GitHub's `latest` skips
# prereleases. Anything else cut on this fork should be marked prerelease.
name: retroXR core release

on:
  push:
    tags:
      - 'retroxr-flycast-libretro-v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build'
        required: true
        default: 'retroxr'
      tag:
        description: 'Release tag to publish as (leave blank to build without publishing)'
        required: false
        default: ''

jobs:
  windows:
    name: Windows x86_64 (mingw-w64)
    runs-on: windows-2022
    defaults:
      run:
        shell: 'msys2 {0}'
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: git make zip mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-toolchain mingw-w64-x86_64-SDL2 mingw-w64-x86_64-libcdio

      # Submodules are not optional: the libretro target pulls libchdr, xbyak,
      # glslang, VulkanMemoryAllocator and more out of core/deps.
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Build
        run: |
          cmake -B build -G Ninja -DLIBRETRO=ON -DUSE_LIBCDIO=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j $(nproc)

      - name: Package
        run: |
          mapfile -t hits < <(find build -maxdepth 2 -name 'flycast_libretro.dll' -type f)
          if [ "${#hits[@]}" -ne 1 ]; then
            echo "expected exactly one flycast_libretro.dll, found ${#hits[@]}:"
            printf '  %s\n' "${hits[@]}"
            exit 1
          fi
          mkdir -p stage
          cp "${hits[0]}" stage/flycast_libretro.dll
          (cd stage && zip -q -X ../flycast_libretro.dll.zip flycast_libretro.dll)
          ls -lh flycast_libretro.dll.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: flycast_libretro.dll.zip
          if-no-files-found: error

  android:
    name: Android arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip zip ninja-build
          # Into RUNNER_TEMP, NOT the workspace: this step runs before
          # actions/checkout, and checkout clears the workspace it checks into.
          wget -q -O "$RUNNER_TEMP/ndk.zip" https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          echo "NDK_ROOT=$RUNNER_TEMP/android-ndk-r27d" >> $GITHUB_ENV

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Build
        run: |
          cmake -B build -G Ninja -DLIBRETRO=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24
          cmake --build build -j $(nproc)

      # CMake names it flycast_libretro.so on every platform; retroXR installs
      # Android cores under the buildbot's _android suffix, so it is renamed on
      # the way into the zip rather than at install time.
      - name: Package
        run: |
          mapfile -t hits < <(find build -maxdepth 2 -name 'flycast_libretro.so' -type f)
          if [ "${#hits[@]}" -ne 1 ]; then
            echo "expected exactly one flycast_libretro.so, found ${#hits[@]}:"
            printf '  %s\n' "${hits[@]}"
            exit 1
          fi
          mkdir -p stage
          cp "${hits[0]}" stage/flycast_libretro_android.so
          (cd stage && zip -q -X ../flycast_libretro_android.so.zip flycast_libretro_android.so)
          ls -lh flycast_libretro_android.so.zip

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: flycast_libretro_android.so.zip
          if-no-files-found: error

  # The oldest Ubuntu runner: a shared library loads only against a glibc at
  # least as new as the one it was linked with. The flags are upstream's own
  # libretro-x86_64-pc-linux-gnu row in c-cpp.yml, less -DUSE_LIBCDIO=ON: that
  # would put a DT_NEEDED on this runner's libcdio.so.19, which a player's
  # distro need not have, for physical CD drives nobody in a headset reads.
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zip libgl1-mesa-dev

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Build
        run: |
          cmake -B build -G Ninja -DLIBRETRO=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=TRUE
          cmake --build build -j $(nproc)

      - name: Package
        run: |
          mapfile -t hits < <(find build -maxdepth 2 -name 'flycast_libretro.so' -type f)
          if [ "${#hits[@]}" -ne 1 ]; then
            echo "expected exactly one flycast_libretro.so, found ${#hits[@]}:"
            printf '  %s\n' "${hits[@]}"
            exit 1
          fi
          mkdir -p stage
          cp "${hits[0]}" stage/flycast_libretro.so
          readelf -d stage/flycast_libretro.so | grep NEEDED
          (cd stage && zip -q -X ../flycast_libretro.so.zip flycast_libretro.so)
          file stage/flycast_libretro.so
          ls -lh flycast_libretro.so.zip

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: flycast_libretro.so.zip
          if-no-files-found: error

  # Both architectures on one Apple Silicon runner. CMakeLists.txt defaults
  # CMAKE_OSX_ARCHITECTURES to a universal x86_64;arm64 build, so each leg names
  # its own; the deployment target stays at that file's 10.15. OpenMP is off
  # because CMakeLists.txt goes looking for Homebrew's libomp, and a core that
  # found it would load a dylib from /opt/homebrew that no player's Mac has.
  # (The macOS bash is 3.2, so no mapfile.)
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-15-intel
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Build
        run: |
          command -v ninja >/dev/null || brew install ninja
          cmake -B build -G Ninja -DLIBRETRO=ON -DCMAKE_BUILD_TYPE=Release \
            -DUSE_OPENMP=OFF -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          cmake --build build -j $(sysctl -n hw.ncpu)

      - name: Package
        run: |
          lib=flycast_libretro.dylib
          hits=()
          while IFS= read -r f; do hits+=("$f"); done < <(find build -maxdepth 2 -name "$lib" -type f)
          if [ "${#hits[@]}" -ne 1 ]; then
            echo "expected exactly one $lib, found ${#hits[@]}:"
            printf '  %s\n' "${hits[@]}"
            exit 1
          fi
          mkdir -p stage
          cp "${hits[0]}" "stage/$lib"
          lipo -info "stage/$lib"
          if [ "$(lipo -archs "stage/$lib")" != "${{ matrix.arch }}" ]; then
            echo "$lib is not ${{ matrix.arch }}"
            exit 1
          fi
          otool -L "stage/$lib"
          if otool -L "stage/$lib" | grep -Eq '/opt/homebrew|/usr/local'; then
            echo "$lib links a Homebrew library"
            exit 1
          fi
          (cd stage && zip -q -X ../flycast_libretro_${{ matrix.arch }}.dylib.zip "$lib")
          ls -lh flycast_libretro_${{ matrix.arch }}.dylib.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: flycast_libretro_${{ matrix.arch }}.dylib.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [windows, android, linux, macos]
    if: github.event_name == 'push' || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -lh dist
          cat > notes.md <<'NOTES'
          flycast libretro core built for retroXR.

          Windows x86_64, Android arm64-v8a, Linux x86_64 and macOS arm64 and
          x86_64. The source for these binaries is this tag. flycast is GPLv2.

          Over the stock buildbot build:

          * Each VMU's LCD is handed to a frontend that answers the controller
            display interface, a private environment call, instead of being
            drawn over the game.
          * Each VMU's beep is handed over through the controller audio
            interface, so a frontend can play it from the card. Without it the
            beeps are mixed into the main stream as before.
          * The Dreamcast microphone (HKT-7200), which Seaman needs, is fed
            from the frontend's libretro microphone interface. The stock
            core's recording calls were empty stubs, so the device reported
            no samples. It fits either expansion slot.
          * The libretro build links libandroid, without which the dynarec
            crashed on its first memory access on Android.
          NOTES
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "flycast (retroXR build) $TAG" \
              --notes-file notes.md
          fi
          gh release upload "$TAG" \
            dist/flycast_libretro.dll.zip \
            dist/flycast_libretro_android.so.zip \
            dist/flycast_libretro.so.zip \
            dist/flycast_libretro_arm64.dylib.zip \
            dist/flycast_libretro_x86_64.dylib.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
